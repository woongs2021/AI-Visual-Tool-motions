<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1013" media="(prefers-color-scheme: dark)">
  <title>PC Health</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/screens.css">
  <!-- modes before first paint: ?ui=1 UI-only · ?capture=1 frozen demo state · ?statusbar=1 system bars · ?embed=1 inside the preview -->
  <script>/* before first paint: theme (?theme= → saved choice → OS) and modes (?ui=1 ?capture=1 ?statusbar=1 ?embed=1) */
  (function(){var p=new URLSearchParams(location.search),r=document.documentElement,c=r.classList,t=p.get('theme');
  if(!t&&p.get('capture')!=='1'&&p.get('embed')!=='1'){try{t=localStorage.getItem('au-theme')}catch(e){}}
  if(t==='light'||t==='dark')r.setAttribute('data-au-theme',t);
  var l=p.get('lang');if(!l&&p.get('capture')!=='1'&&p.get('embed')!=='1'){try{l=localStorage.getItem('au-lang')}catch(e){}}if(l==='ko'){r.setAttribute('data-au-lang','ko');r.lang='ko';r.classList.add('au-i18n-pending');setTimeout(function(){r.classList.remove('au-i18n-pending')},1500);}
  if(p.get('ui')==='1')c.add('is-ui-only');if(p.get('capture')==='1')c.add('is-capture');if(p.get('statusbar')==='1')c.add('has-system-bars');if(p.get('embed')==='1')c.add('is-embed');})();</script>
  <script src="scripts/i18n/ko.js" defer></script>
  <script src="scripts/app.js" defer></script>
</head>
<body>
<div class="au-stage">
  <div class="au-screen" id="screen" data-au-app="pc-health" data-au-screen="pc-health" data-au-back="pc-health-home.html">
    <div class="au-status-bar" aria-hidden="true"><span class="au-num">9:41</span></div>

    <header class="au-app-bar">
      <button class="au-icon-button" type="button" aria-label="Back" data-action="back"><i class="au-icon au-icon--back"></i></button>
      <h1 class="au-app-bar__title">PC Health</h1>
      <button class="au-icon-button" type="button" aria-label="More options" aria-haspopup="dialog" aria-controls="ph-menu" data-action="menu"><i class="au-icon au-icon--more"></i></button>
    </header>

    <main class="au-content" id="content">
      <section class="ph-score" aria-label="Overall health">
        <div class="ph-ring" id="ph-ring" data-tone="positive" role="meter" aria-label="Health score" aria-valuemin="0" aria-valuemax="100" aria-valuenow="98" aria-valuetext="98%, Healthy">
          <svg viewBox="0 0 176 176" aria-hidden="true" focusable="false">
            <circle class="ph-ring__track" cx="88" cy="88" r="81"/>
            <circle class="ph-ring__value" id="ph-ring-value" cx="88" cy="88" r="81" stroke-dasharray="508.94" stroke-dashoffset="10.18"/>
          </svg>
          <div class="ph-ring__label" aria-hidden="true">
            <span class="ph-ring__num"><span id="ph-score">98</span><small>%</small></span>
            <span class="ph-ring__state" id="ph-state">Healthy</span>
          </div>
        </div>
        <div class="ph-device">
          <div class="ph-device__text">
            <span class="ph-device__name" id="ph-device-name">ThinkPad X1 Carbon</span>
            <span class="ph-device__time" id="ph-time">Scanned 2 min ago</span>
          </div>
          <span class="ph-device__sep" aria-hidden="true"></span>
          <button class="au-button au-button--text" type="button" data-action="rescan" id="ph-rescan"><i class="au-icon au-icon--refresh"></i><span>Rescan</span></button>
        </div>
      </section>

      <section class="au-section" aria-label="Diagnostics" style="margin-top: var(--au-section-gap)">
        <div class="ph-diags" id="ph-diags"><!-- CPU · GPU · Memory, rendered by app.js --></div>
        <div class="au-notice" id="ph-notice" data-tone="positive" role="status">
          <i class="au-icon au-icon--shield" id="ph-notice-icon"></i>
          <p class="au-notice__text" id="ph-notice-text"><strong>All components passed.</strong> This PC is in great shape for a trade.</p>
        </div>
      </section>
    </main>

    <footer class="au-footer">
      <button class="au-button" type="button" data-action="report"><span>View Full Report</span></button>
    </footer>

    <div class="au-home-indicator" aria-hidden="true"></div>

    <!-- floating layers -->
    <div class="au-scrim" data-action="close-sheet" hidden></div>

    <section class="au-sheet" id="ph-report" role="dialog" aria-modal="true" aria-labelledby="ph-report-title" tabindex="-1" hidden>
      <div class="au-sheet__grabber" aria-hidden="true"></div>
      <div class="au-sheet__head">
        <h2 class="au-sheet__title" id="ph-report-title">Full Report</h2>
        <button class="au-icon-button" type="button" aria-label="Close" data-action="close-sheet"><i class="au-icon au-icon--close"></i></button>
      </div>
      <div class="au-sheet__body" id="ph-report-body"></div>
      <div class="au-sheet__foot">
        <button class="au-button au-button--secondary" type="button" data-action="share"><i class="au-icon au-icon--share"></i><span>Share</span></button>
        <button class="au-button" type="button" data-action="close-sheet"><span>Done</span></button>
      </div>
    </section>

    <section class="au-sheet" id="ph-menu" role="dialog" aria-modal="true" aria-labelledby="ph-menu-title" tabindex="-1" hidden>
      <div class="au-sheet__grabber" aria-hidden="true"></div>
      <div class="au-sheet__head">
        <h2 class="au-sheet__title" id="ph-menu-title">Options</h2>
        <button class="au-icon-button" type="button" aria-label="Close" data-action="close-sheet"><i class="au-icon au-icon--close"></i></button>
      </div>
      <div class="au-sheet__body">
        <div class="au-menu">
          <button class="au-menu__item" type="button" data-action="rescan"><i class="au-icon au-icon--refresh"></i>Run a new scan</button>
          <button class="au-menu__item" type="button" data-action="share"><i class="au-icon au-icon--link"></i>Copy report link</button>
          <button class="au-menu__item" type="button" data-action="reset" data-tone="critical"><i class="au-icon au-icon--reset"></i>Reset demo data</button>
        </div>
      </div>
    </section>

    <div class="au-toast" role="status" aria-live="polite"><div class="au-toast__inner" id="toast"></div></div>
    <p class="au-visually-hidden" aria-live="polite"></p>
  </div>

  <nav class="au-devbar" aria-label="Preview controls">
    <a href="index.html"><i class="au-icon au-icon--back"></i>All screens</a>
    <button type="button" data-dev="theme" aria-label="Theme: System">Theme: System</button>
    <button type="button" data-dev="lang" translate="no">한국어</button>
    <button type="button" data-dev="system-bars" aria-pressed="false">Status bar</button>
    <button type="button" data-dev="ui-only" aria-pressed="false">UI-only</button>
    <button type="button" data-dev="reset"><i class="au-icon au-icon--reset"></i>Reset</button>
  </nav>
</div>
</body>
</html>
