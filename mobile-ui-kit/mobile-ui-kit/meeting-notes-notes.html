<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1013" media="(prefers-color-scheme: dark)">
  <title>Notes</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/screens.css">
  <link rel="stylesheet" href="styles/flows.css">
  <script>/* before first paint: theme (?theme= → saved choice → OS) and modes (?ui=1 ?capture=1 ?statusbar=1 ?embed=1) */
  (function(){var p=new URLSearchParams(location.search),r=document.documentElement,c=r.classList,t=p.get('theme');
  if(!t&&p.get('capture')!=='1'&&p.get('embed')!=='1'){try{t=localStorage.getItem('au-theme')}catch(e){}}
  if(t==='light'||t==='dark')r.setAttribute('data-au-theme',t);
  var l=p.get('lang');if(!l&&p.get('capture')!=='1'&&p.get('embed')!=='1'){try{l=localStorage.getItem('au-lang')}catch(e){}}if(l==='ko'){r.setAttribute('data-au-lang','ko');r.lang='ko';r.classList.add('au-i18n-pending');setTimeout(function(){r.classList.remove('au-i18n-pending')},1500);}
  if(p.get('ui')==='1')c.add('is-ui-only');if(p.get('capture')==='1')c.add('is-capture');if(p.get('statusbar')==='1')c.add('has-system-bars');if(p.get('embed')==='1')c.add('is-embed');})();</script>
  <script src="scripts/i18n/ko.js" defer></script>
  <script src="scripts/app.js" defer></script>
  <script src="scripts/flows/meeting-notes.js" defer></script>
</head>
<body>
<div class="au-stage">
  <div class="au-screen" id="screen" data-au-app="meeting-notes" data-au-screen="meeting-notes-notes" data-au-back="meeting-notes-home.html" data-au-store="meeting-notes">
    <div class="au-status-bar" aria-hidden="true"><span class="au-num">9:41</span></div>

    <header class="au-app-bar">
      <button class="au-icon-button" type="button" aria-label="Back" data-action="back"><i class="au-icon au-icon--back" aria-hidden="true"></i></button>
      <h1 class="au-app-bar__title" id="app-title">Notes</h1>
      <button class="au-icon-button" type="button" aria-label="More options" aria-haspopup="dialog" aria-controls="meeting-notes-notes-menu" data-action="sheet"><i class="au-icon au-icon--more" aria-hidden="true"></i></button>
    </header>

    <main class="au-content" id="content">

      <section aria-labelledby="mn-n-title">
        <h2 class="au-title au-truncate" id="mn-n-title">Q4 Product Sync</h2>
        <div class="fl-meta-row"><span class="au-avatars au-avatars--sm" id="mn-n-people" role="img" aria-label="Attendees"></span><p class="au-text-meta au-truncate" id="mn-n-meta">Today, 02:36, 4 speakers</p></div>
      </section>
      <section class="au-card fl-gap" aria-labelledby="mn-n-sum-title">
        <div class="au-card__head"><i class="au-icon au-icon--sparkle" aria-hidden="true"></i><h2 class="au-card__title" id="mn-n-sum-title">AI Summary</h2><span class="au-demo-tag">Demo</span></div>
        <p class="fl-summary au-clamp-3" id="mn-n-summary"></p>
      </section>
      <section class="au-card" style="margin-top:var(--au-gap)" aria-label="Notes">
        <div class="au-segmented" role="tablist" aria-label="Notes view">
          <button class="au-segmented__tab" type="button" role="tab" id="mn-n-tab-points" aria-controls="mn-n-panel" aria-selected="true" data-tab="points">Key points</button>
          <button class="au-segmented__tab" type="button" role="tab" id="mn-n-tab-decisions" aria-controls="mn-n-panel" aria-selected="false" tabindex="-1" data-tab="decisions">Decisions</button>
          <button class="au-segmented__tab" type="button" role="tab" id="mn-n-tab-actions" aria-controls="mn-n-panel" aria-selected="false" tabindex="-1" data-tab="actions">Actions</button>
        </div>
        <div class="fl-panel" role="tabpanel" id="mn-n-panel" aria-labelledby="mn-n-tab-points"></div>
      </section>
      <a class="fl-item fl-item--compact" style="margin-top:var(--au-gap)" href="meeting-notes-transcript.html" data-nav id="mn-n-transcript">
        <span class="au-icon-box" aria-hidden="true"><i class="au-icon au-icon--doc" aria-hidden="true"></i></span>
        <span class="fl-item__text"><span class="fl-item__title">Full transcript</span><span class="fl-item__meta" id="mn-n-tmeta">14 lines, 4 speakers</span></span>
        <span></span><i class="fl-item__chev au-icon au-icon--chevron-right" aria-hidden="true"></i>
      </a>
    </main>

    <footer class="au-footer">
      <button class="au-button" type="button" data-action="sheet" aria-haspopup="dialog" aria-controls="mn-n-share"><i class="au-icon au-icon--share" aria-hidden="true" style="width:20px;height:20px"></i><span>Share Notes</span></button>
    </footer>

    <div class="au-home-indicator" aria-hidden="true"></div>

    <div class="au-scrim" data-action="close-sheet" hidden></div>
    <section class="au-sheet" id="meeting-notes-notes-menu" role="dialog" aria-modal="true" aria-labelledby="meeting-notes-notes-menu-title" tabindex="-1" hidden>
      <div class="au-sheet__grabber" aria-hidden="true"></div>
      <div class="au-sheet__head">
        <h2 class="au-sheet__title" id="meeting-notes-notes-menu-title">Options</h2>
        <button class="au-icon-button" type="button" aria-label="Close" data-action="close-sheet"><i class="au-icon au-icon--close" aria-hidden="true"></i></button>
      </div>
      <div class="au-sheet__body">
        <div class="au-menu">
          <a class="au-menu__item" href="flows.html"><i class="au-icon au-icon--list" aria-hidden="true"></i>All screens</a>
          <button class="au-menu__item" type="button" data-action="reset" data-tone="critical"><i class="au-icon au-icon--reset" aria-hidden="true"></i>Reset demo data</button>
        </div>
      </div>
    </section>
    <section class="au-sheet" id="mn-n-share" role="dialog" aria-modal="true" aria-labelledby="mn-n-share-title" tabindex="-1" hidden>
      <div class="au-sheet__grabber" aria-hidden="true"></div>
      <div class="au-sheet__head">
        <h2 class="au-sheet__title" id="mn-n-share-title">Share notes</h2>
        <button class="au-icon-button" type="button" aria-label="Close" data-action="close-sheet"><i class="au-icon au-icon--close" aria-hidden="true"></i></button>
      </div>
      <div class="au-sheet__body"><div class="au-menu">
          <button class="au-menu__item" type="button" data-action="demo" data-msg="Link copied (demo)"><i class="au-icon au-icon--copy" aria-hidden="true"></i>Copy link</button>
          <button class="au-menu__item" type="button" data-action="demo" data-msg="Sent to 4 attendees (demo)"><i class="au-icon au-icon--chat" aria-hidden="true"></i>Email attendees</button>
          <button class="au-menu__item" type="button" data-action="demo" data-msg="PDF saved (demo)"><i class="au-icon au-icon--doc" aria-hidden="true"></i>Save as PDF</button>
        </div></div>
    </section>

    <div class="au-toast" role="status" aria-live="polite"><div class="au-toast__inner" id="toast"></div></div>
    <p class="au-visually-hidden" aria-live="polite"></p>
  </div>

  <nav class="au-devbar" aria-label="Preview controls">
    <a href="flows.html"><i class="au-icon au-icon--list" aria-hidden="true"></i>All screens</a>
    <button type="button" data-dev="theme">Theme: System</button>
    <button type="button" data-dev="lang" translate="no">한국어</button>
    <button type="button" data-dev="system-bars" aria-pressed="false">Status bar</button>
    <button type="button" data-dev="ui-only" aria-pressed="false">UI-only</button>
    <button type="button" data-dev="reset"><i class="au-icon au-icon--reset" aria-hidden="true"></i>Reset</button>
  </nav>
</div>
</body>
</html>
