<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1013" media="(prefers-color-scheme: dark)">
  <title>GPU</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/screens.css">
  <link rel="stylesheet" href="styles/flows.css">
  <script>/* before first paint: theme (?theme= → saved choice → OS) and modes (?ui=1 ?capture=1 ?statusbar=1 ?embed=1) */
  (function(){var p=new URLSearchParams(location.search),r=document.documentElement,c=r.classList,t=p.get('theme');
  if(!t&&p.get('capture')!=='1'&&p.get('embed')!=='1'){try{t=localStorage.getItem('au-theme')}catch(e){}}
  if(t==='light'||t==='dark')r.setAttribute('data-au-theme',t);
  var l=p.get('lang');if(!l&&p.get('capture')!=='1'&&p.get('embed')!=='1'){try{l=localStorage.getItem('au-lang')}catch(e){}}if(l==='ko'){r.setAttribute('data-au-lang','ko');r.lang='ko';r.classList.add('au-i18n-pending');setTimeout(function(){r.classList.remove('au-i18n-pending')},1500);}
  if(p.get('ui')==='1')c.add('is-ui-only');if(p.get('capture')==='1')c.add('is-capture');if(p.get('statusbar')==='1')c.add('has-system-bars');if(p.get('embed')==='1')c.add('is-embed');})();</script>
  <script src="scripts/i18n/ko.js" defer></script>
  <script src="scripts/app.js" defer></script>
  <script src="scripts/flows/pc-health.js" defer></script>
</head>
<body>
<div class="au-stage">
  <div class="au-screen" id="screen" data-au-app="pc-health" data-au-screen="pc-health-part" data-au-back="pc-health.html pc-health-report.html" data-au-store="pc-health">
    <div class="au-status-bar" aria-hidden="true"><span class="au-num">9:41</span></div>

    <header class="au-app-bar">
      <button class="au-icon-button" type="button" aria-label="Back" data-action="back"><i class="au-icon au-icon--back" aria-hidden="true"></i></button>
      <h1 class="au-app-bar__title" id="app-title">GPU</h1>
      <button class="au-icon-button" type="button" aria-label="More options" aria-haspopup="dialog" aria-controls="pc-health-part-menu" data-action="sheet"><i class="au-icon au-icon--more" aria-hidden="true"></i></button>
    </header>

    <main class="au-content" id="content">

      <section class="au-card fl-part-hero" id="ph-p-hero" data-tone="positive">
        <span class="au-icon-box au-icon-box--lg" aria-hidden="true"><i class="au-icon au-icon--gpu" id="ph-p-icon"></i></span>
        <div class="fl-item__text"><h2 class="fl-item__title" id="ph-p-name">GPU</h2><p class="fl-item__meta" id="ph-p-spec">Intel Iris Xe Graphics</p></div>
        <div class="fl-item__end"><p class="fl-part-hero__pct" id="ph-p-pct">99%</p><span class="au-badge" data-tone="positive" id="ph-p-badge">Normal</span></div>
      </section>
      <section class="au-card fl-gap" aria-labelledby="ph-p-chart-title" id="ph-p-chart-card" data-tone="positive">
        <div class="au-card__head"><i class="au-icon au-icon--thermo" aria-hidden="true"></i><h2 class="au-card__title" id="ph-p-chart-title">Temperature under load</h2><span class="au-demo-tag">Demo</span></div>
        <p class="au-text-meta" id="ph-p-chart-meta">Peak 48°C in a 5-minute stress test</p>
        <svg class="fl-chart" id="ph-p-chart" viewBox="0 0 310 132" role="img" aria-label="Temperature chart"></svg>
      </section>
      <section class="au-card" style="margin-top:var(--au-gap)" aria-label="Measurements"><dl class="au-rows" id="ph-p-rows"></dl></section>
      <div class="au-notice fl-gap" id="ph-p-notice" data-tone="positive"><i class="au-icon au-icon--shield" aria-hidden="true"></i><p class="au-notice__text" id="ph-p-verdict"></p></div>
    </main>

    <footer class="au-footer">
      <button class="au-button" type="button" data-action="sheet" aria-haspopup="dialog" aria-controls="ph-p-ask"><i class="au-icon au-icon--chat" aria-hidden="true" style="width:20px;height:20px"></i><span>Ask the Seller</span></button>
    </footer>

    <div class="au-home-indicator" aria-hidden="true"></div>

    <div class="au-scrim" data-action="close-sheet" hidden></div>
    <section class="au-sheet" id="pc-health-part-menu" role="dialog" aria-modal="true" aria-labelledby="pc-health-part-menu-title" tabindex="-1" hidden>
      <div class="au-sheet__grabber" aria-hidden="true"></div>
      <div class="au-sheet__head">
        <h2 class="au-sheet__title" id="pc-health-part-menu-title">Options</h2>
        <button class="au-icon-button" type="button" aria-label="Close" data-action="close-sheet"><i class="au-icon au-icon--close" aria-hidden="true"></i></button>
      </div>
      <div class="au-sheet__body">
        <div class="au-menu">
          <a class="au-menu__item" href="flows.html"><i class="au-icon au-icon--list" aria-hidden="true"></i>All screens</a>
          <button class="au-menu__item" type="button" data-action="reset" data-tone="critical"><i class="au-icon au-icon--reset" aria-hidden="true"></i>Reset demo data</button>
        </div>
      </div>
    </section>
    <section class="au-sheet" id="ph-p-ask" role="dialog" aria-modal="true" aria-labelledby="ph-p-ask-title" tabindex="-1" hidden>
      <div class="au-sheet__grabber" aria-hidden="true"></div>
      <div class="au-sheet__head">
        <h2 class="au-sheet__title" id="ph-p-ask-title">Ask the seller</h2>
        <button class="au-icon-button" type="button" aria-label="Close" data-action="close-sheet"><i class="au-icon au-icon--close" aria-hidden="true"></i></button>
      </div>
      <div class="au-sheet__body"><p class="au-text-meta" style="font-size:14px;line-height:20px">A message you can send in your chat with the seller.</p><p class="au-card" id="ph-p-msg" style="margin-top:12px;font-size:15px;line-height:22px"></p></div>
      <div class="au-sheet__foot"><button class="au-button" type="button" data-action="copy-msg"><i class="au-icon au-icon--copy" aria-hidden="true" style="width:20px;height:20px"></i><span>Copy Message</span></button></div>
    </section>

    <div class="au-toast" role="status" aria-live="polite"><div class="au-toast__inner" id="toast"></div></div>
    <p class="au-visually-hidden" aria-live="polite"></p>
  </div>

  <nav class="au-devbar" aria-label="Preview controls">
    <a href="flows.html"><i class="au-icon au-icon--list" aria-hidden="true"></i>All screens</a>
    <button type="button" data-dev="theme">Theme: System</button>
    <button type="button" data-dev="lang" translate="no">한국어</button>
    <button type="button" data-dev="system-bars" aria-pressed="false">Status bar</button>
    <button type="button" data-dev="ui-only" aria-pressed="false">UI-only</button>
    <button type="button" data-dev="reset"><i class="au-icon au-icon--reset" aria-hidden="true"></i>Reset</button>
  </nav>
</div>
</body>
</html>
